name: v-market
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: vmarket
      POSTGRES_USER: vmarket
      POSTGRES_PASSWORD: vmarket
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vmarket -d vmarket"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - vmarket-postgres:/var/lib/postgresql/data

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vmarket
      SPRING_DATASOURCE_USERNAME: vmarket
      SPRING_DATASOURCE_PASSWORD: vmarket
      SPRING_DATA_REDIS_URL: redis://redis:6379
      BFF_SHARED_SECRET: local-bff-secret
      VMARKET_OPS_SECRET: local-development-only
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  vmarket-postgres:
